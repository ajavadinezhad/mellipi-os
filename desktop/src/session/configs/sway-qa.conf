# Isolated Sway QA fixture; native login never reads this configuration.
font pango:Sans 10
xwayland enable
default_border normal 1
default_floating_border normal 1
titlebar_padding 5 3
client.focused #6c8d82 #25352f #e1e8ed #6c8d82 #6c8d82
client.unfocused #303b40 #1b252a #9fadb6 #303b40 #303b40
focus_follows_mouse no
mouse_warping none
floating_modifier Mod4 normal
for_window [all] floating enable
floating_minimum_size 240 x 120
floating_maximum_size -1 x -1
bindsym Mod4+q kill
bindsym Mod4+f fullscreen toggle
bindsym Mod4+space floating toggle
bindsym Mod4+1 workspace number 1
bindsym Mod4+2 workspace number 2
bindsym Mod4+3 workspace number 3
bindsym Mod4+4 workspace number 4
bindsym Mod4+Shift+1 move container to workspace number 1
bindsym Mod4+Shift+2 move container to workspace number 2
bindsym Mod4+Shift+3 move container to workspace number 3
bindsym Mod4+Shift+4 move container to workspace number 4
# Absolute paths and Orbit shortcuts are generated by run-wayland-session.py.
